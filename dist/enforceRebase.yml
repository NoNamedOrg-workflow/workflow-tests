# Generated from tools/inlineWorkflow.template.yml by tools/buildInlineWorkflow.sh: edit the template or the scripts
# under .github/scripts, never this file. The scripts are embedded because an internal repository cannot download the
# scripts of another repository with the default token. A required workflow is read from the base branch, so the
# pull request cannot change the decision code embedded here.
name: Enforce Rebase

run-name: "CI: Enforce rebase before merge"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # workflow_ref names the pinned version: a canary and the active version on the same PR must not cancel each other.
  group: enforce-rebase-${{ github.repository }}-${{ github.workflow }}-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebase-status:
    runs-on: ubuntu-latest
    # Pull request data reaches the shell only through env, so a branch name can never be parsed as shell syntax.
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check rebase
        id: check
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/checkRebase.sh" <<'CHECK_REBASE_SCRIPT_EOF'
          #!/usr/bin/env bash
          # Pure decision: exit 0 rebased, 1 policy failure, 2 unexpected input. Side effects live elsewhere so the
          # same rule runs on a laptop and in CI.
          set -euo pipefail

          if [ "$#" -lt 2 ]; then
              echo "usage: checkRebase.sh <baseSha> <headSha> [baseName]" >&2
              exit 2
          fi

          baseSha=$1
          headSha=$2
          baseName=${3:-base}

          requireCommit() {
              git cat-file -e "$1^{commit}" 2>/dev/null && return 0
              echo "unknown commit: $1" >&2
              exit 2
          }

          requireCommit "$baseSha"
          requireCommit "$headSha"

          # A shallow history would make the lag and merge counts wrong, so refuse instead of guessing.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "shallow clone: fetch the full history before checking" >&2
              exit 2
          fi

          if ! git merge-base "$baseSha" "$headSha" > /dev/null 2>&1; then
              echo "no common ancestor between $baseName and the branch" >&2
              exit 2
          fi

          reasons=()

          merges=$(git rev-list --merges "$baseSha..$headSha")
          if [ -n "$merges" ]; then
              count=$(echo "$merges" | wc -l | tr -d ' ')
              reasons+=("$count merge commit(s) on the branch: rebase it onto $baseName to remove them")
          fi

          if ! git merge-base --is-ancestor "$baseSha" "$headSha"; then
              lag=$(git rev-list --count "$headSha..$baseSha")
              reasons+=("branch is $lag commit(s) behind $baseName")
          fi

          if [ "${#reasons[@]}" -eq 0 ]; then
              echo "branch is rebased onto $baseName"
              exit 0
          fi

          printf '%s\n' "${reasons[@]}"
          exit 1
          CHECK_REBASE_SCRIPT_EOF
          cat > "$RUNNER_TEMP/reportRebase.sh" <<'REPORT_REBASE_SCRIPT_EOF'
          #!/usr/bin/env bash
          # Effect only: a label and a sticky comment. The verdict is decided elsewhere, so a failure here must never
          # turn a red check green or a green one red (a read-only token on a fork pull request cannot write).
          set -uo pipefail

          for name in REPO NUMBER BASE OK REASON; do
              [ -n "${!name:-}" ] && continue
              echo "missing variable: $name" >&2
              exit 2
          done

          case "$OK" in
              true | false) ;;
              *) echo "OK must be true or false" >&2; exit 2 ;;
          esac

          marker="<!-- rebase-guard-org -->"
          label="rebase-required"
          fence='```'

          warn() {
              echo "::warning::$1"
          }

          # A listing that cannot be read could hide an existing comment, and guessing would post a duplicate.
          if ! listing=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --slurp 2> /dev/null); then
              warn "could not list the comments of #$NUMBER; the rebase report was skipped"
              exit 0
          fi

          # Only the bot's own comment counts: anyone could quote the marker to redirect the report.
          if ! previousId=$(echo "$listing" | jq -r --arg marker "$marker" \
              'add | map(select(.user.login == "github-actions[bot]" and ((.body // "") | startswith($marker)))) | last.id // empty' 2> /dev/null); then
              warn "the comments of #$NUMBER could not be read; the rebase report was skipped"
              exit 0
          fi

          upsertComment() {
              if [ -z "$previousId" ]; then
                  gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -f body="$1" --silent \
                      || warn "could not create the rebase comment on #$NUMBER"
                  return 0
              fi
              gh api -X PATCH "repos/$REPO/issues/comments/$previousId" -f body="$1" --silent \
                  || warn "could not update the rebase comment on #$NUMBER"
          }

          if [ "$OK" = "true" ]; then
              [ -z "$previousId" ] || upsertComment "$marker
          ✅ **Rebase OK** — $REASON"
              gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/$label" --silent 2> /dev/null || true
              exit 0
          fi

          # A branch name may contain shell syntax, and this snippet is pasted into a terminal.
          quotedBase=$(printf '%q' "origin/$BASE")

          upsertComment "$marker
          ❌ **Branch is not rebased** — $REASON

          ${fence}bash
          git fetch origin
          git rebase $quotedBase
          git push --force-with-lease
          ${fence}

          If you use the **Update branch** button, choose **Update with rebase**: the merge commit option adds a merge commit, which this check rejects."

          gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$label" --silent \
              || warn "could not apply the $label label on #$NUMBER"
          exit 0
          REPORT_REBASE_SCRIPT_EOF
          chmod +x "$RUNNER_TEMP/checkRebase.sh" "$RUNNER_TEMP/reportRebase.sh"

          # The full ref keeps a tag named like the base branch from winning the fetch.
          git fetch --no-tags origin "refs/heads/$BASE"

          rc=0
          reason=$("$RUNNER_TEMP/checkRebase.sh" "$(git rev-parse FETCH_HEAD)" "$HEAD_SHA" "origin/$BASE") || rc=$?

          if [ "$rc" -gt 1 ]; then
              echo "::error::checkRebase.sh failed unexpectedly (exit $rc)"
              exit "$rc"
          fi

          ok=true
          [ "$rc" -eq 0 ] || ok=false
          [ -n "$reason" ] || reason="verification produced no diagnosis (exit $rc)"

          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          printf '%s' "$reason" > "$RUNNER_TEMP/rebaseReason.txt"
          echo "$reason"

      - name: Report on the pull request
        continue-on-error: true
        env:
          OK: ${{ steps.check.outputs.ok }}
        run: |
          REASON=$(cat "$RUNNER_TEMP/rebaseReason.txt") "$RUNNER_TEMP/reportRebase.sh"

      - name: Fail when the branch is not rebased
        if: steps.check.outputs.ok == 'false'
        run: |
          echo "::error::$(tr '\n' ' ' < "$RUNNER_TEMP/rebaseReason.txt")"
          exit 1
