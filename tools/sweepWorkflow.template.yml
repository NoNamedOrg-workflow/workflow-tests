# Generated from tools/sweepWorkflow.template.yml by tools/buildSweepWorkflow.sh: edit the template or the script
# under .github/scripts, never this file. The script is embedded because an internal repository cannot download the
# scripts of another repository with the default token.
name: Rebase Sweep (reusable)

run-name: "CI: Re-check open pull requests"

on:
  workflow_call:
    inputs:
      workflowPath:
        description: Path of the rebase check workflow whose latest run is replayed
        type: string
        default: .github/workflows/enforceRebase.yml
      waitSeconds:
        description: Seconds to wait for the runs in progress before giving up, from 0 to 300; the runs are read every 10 seconds, so a value below 10 waits for nothing
        type: string
        default: "120"

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    # No concurrency on purpose: sweeps of two pushes can overlap, and GitHub refuses a rerun of a run that is already
    # being rerun, which the script treats as benign.
    timeout-minutes: 10
    # The sweep only replays runs: the label and the comment are written by the replayed check with its own token.
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.ref_name }}
      WORKFLOW_PATH: ${{ inputs.workflowPath }}
      WAIT_SECONDS: ${{ inputs.waitSeconds }}
    steps:
      - name: Replay the check of the open pull requests
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/recheckSweep.sh" <<'RECHECK_SWEEP_SCRIPT_EOF'
__RECHECK_SWEEP_SCRIPT__
          RECHECK_SWEEP_SCRIPT_EOF
          chmod +x "$RUNNER_TEMP/recheckSweep.sh"
          [[ "$WAIT_SECONDS" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$WAIT_SECONDS" -le 300 ] \
              || { echo "::error::waitSeconds must be an integer from 0 to 300"; exit 2; }
          "$RUNNER_TEMP/recheckSweep.sh"
