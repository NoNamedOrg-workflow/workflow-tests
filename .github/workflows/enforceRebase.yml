name: Recheck Probe

run-name: "probe ${{ github.event_name }}/${{ github.event.action }} pr=${{ github.event.pull_request.number }} attempt=${{ github.run_attempt }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "PROBE inert attempt=${{ github.run_attempt }}"
