name: Recheck Probe

run-name: "probe ${{ github.event_name }}/${{ github.event.action }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  status:
  create:
  delete:
  push:
  repository_dispatch:
  workflow_run:
    workflows: [Dummy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "PROBE event=${{ github.event_name }} action=${{ github.event.action }}"
